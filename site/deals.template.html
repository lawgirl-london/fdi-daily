<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Tracker · {{TITLE}}</title>
<link rel="apple-touch-icon" href="cover.png">
<style>
  :root { --bg: #f7f5f0; --fg: #1d2330; --muted: #5d6576; --accent: #1f4e79; --card: #fff; --line: #e3dfd6;
          --blocked: #b3261e; --conditions: #b26a00; --withdrawn: #6b5b95; --divestment: #8c1d40; --pending: #5d6576; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --fg: #e8e6e1; --muted: #9aa1ae; --accent: #8db8e6; --card: #1c2028; --line: #2c313b;
            --blocked: #f2766d; --conditions: #f0b45a; --withdrawn: #b3a5dc; --divestment: #e88aa8; --pending: #9aa1ae; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); }
  .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td:first-child { white-space: nowrap; }
  .muted { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem; font-weight: 600;
          border: 1px solid currentColor; white-space: nowrap; }
  .o-blocked .pill { color: var(--blocked); } .o-conditions .pill { color: var(--conditions); }
  .o-withdrawn .pill { color: var(--withdrawn); } .o-divestment .pill { color: var(--divestment); }
  .o-pending .pill { color: var(--pending); }
</style>
</head>
<body>
<main>
  <p><a href="./">← {{TITLE}}</a></p>
  <h1>Deal Tracker</h1>
  <p class="sub">{{COUNT}} transactions blocked, conditioned, withdrawn or under review on FDI / national-security grounds, as reported in the briefing. Newest update first.</p>
  <div class="wrap">
    <table>
      <thead><tr><th>Updated</th><th>Outcome</th><th>Juris.</th><th>Deal</th><th>Detail &amp; sources</th></tr></thead>
      <tbody>{{ROWS}}
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
